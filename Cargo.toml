[package]
name = "VJDownloader"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
eframe = "0.35.0"
arboard = "3.6.1"
url = "2.5.8"
drag = "2.1.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
walkdir = "2.5.0"
notify = "8.2.0"
unicode-normalization = "0.1.24"
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }

[dev-dependencies]
tempfile = "3.25.0"

[features]
default = ["syphon"]
# 公式 Syphon.framework をリンクし、マスター映像を Syphon サーバとして配信する。
# Syphon.framework は実行時に読み込む。未配置時はUIに初期化失敗として表示する。
syphon = ["dep:objc2-metal", "dep:objc2-core-foundation"]

[profile.dev]
debug-assertions = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSObject", "NSThread", "NSURL", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSOpenPanel", "NSPanel", "NSSavePanel", "NSWindow", "NSResponder", "NSImage"] }
# Syphon 出力用（`syphon` フィーチャー時のみ）。
objc2-metal = { version = "0.3.2", optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true, features = ["CFCGTypes"] }
